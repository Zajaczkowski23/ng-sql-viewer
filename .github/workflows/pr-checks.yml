name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm test -- --watch=false
      - run: npm run build
